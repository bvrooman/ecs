<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ecs — particle fountain (WebAssembly)</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; min-height: 100%;
    background: #07070c;
    color: #d8d8e0;
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 24px; box-sizing: border-box;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: .04em; color: #f0c789; }
  h1 span { color: #6a6a78; }
  .stage { position: relative; }
  canvas {
    display: block;
    width: 760px; height: 760px; max-width: 88vmin; max-height: 88vmin;
    border-radius: 10px;
    box-shadow: 0 0 0 1px #1b1b26, 0 18px 60px -20px #000;
    background: #05050a;
    cursor: crosshair;
    touch-action: none;
  }
  .hud {
    position: absolute; top: 14px; left: 16px;
    line-height: 1.5;
    pointer-events: none; text-shadow: 0 1px 2px #000;
  }
  .hud .fps   { color: #ffffff; }
  .hud .count { color: #f0c789; }
  .hud .k     { color: #6a6a78; }

  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 18px;
    padding: 10px 16px;
    background: #0e0e16; border: 1px solid #1b1b26; border-radius: 10px;
  }
  .controls label { display: flex; align-items: center; gap: 8px; color: #9a9aa8; }
  .controls input[type=range] { width: 120px; accent-color: #f0a849; }
  .controls .val { color: #d8d8e0; min-width: 34px; text-align: right; }
  .controls button {
    font: inherit; color: #d8d8e0;
    background: #1a1a26; border: 1px solid #2a2a3a; border-radius: 7px;
    padding: 5px 12px; cursor: pointer;
  }
  .controls button:hover { background: #20202e; border-color: #3a3a4e; }
  .controls button:active { background: #2a2a3a; }
  .controls .hint { color: #5a5a68; }
  footer { color: #5a5a68; font-size: 12px; }
  footer b { color: #8a8a98; font-weight: 500; }
</style>
</head>
<body>
  <h1>ecs particle fountain <span>· wasm · single-threaded</span></h1>

  <div class="stage">
    <canvas id="canvas" width="760" height="760" tabindex="-1"
            oncontextmenu="event.preventDefault()"></canvas>
    <div class="hud">
      <div><span class="k">fps </span><span class="fps" id="fps">--</span></div>
      <div><span class="k">particles </span><span class="count" id="count">0</span></div>
    </div>
  </div>

  <div class="controls">
    <label>gravity
      <input id="gravity" type="range" min="-4" max="2" step="0.1" value="-1.7">
      <span class="val" id="gravityVal">-1.7</span>
    </label>
    <label>emit / tick
      <input id="emit" type="range" min="0" max="80" step="1" value="20">
      <span class="val" id="emitVal">20</span>
    </label>
    <button id="pause">pause</button>
    <button id="reset">reset</button>
    <span class="hint">move the cursor over the canvas to aim the nozzle</span>
  </div>

  <footer>ECS schedule (<b>11 systems</b>, 5 waves) stepping at 120&nbsp;Hz, drawn as additive WebGL2 point sprites.</footer>

  <script>
    function wireControls() {
      var call = function (name, args) { if (Module && Module[name]) Module[name].apply(null, args); };

      var g = document.getElementById('gravity'), gv = document.getElementById('gravityVal');
      g.addEventListener('input', function () {
        gv.textContent = parseFloat(g.value).toFixed(1);
        call('_ecs_set_gravity', [parseFloat(g.value)]);
      });

      var em = document.getElementById('emit'), ev = document.getElementById('emitVal');
      em.addEventListener('input', function () {
        ev.textContent = em.value;
        call('_ecs_set_emit_rate', [parseInt(em.value, 10)]);
      });

      var paused = false, pauseBtn = document.getElementById('pause');
      pauseBtn.addEventListener('click', function () {
        paused = !paused;
        call('_ecs_set_paused', [paused ? 1 : 0]);
        pauseBtn.textContent = paused ? 'resume' : 'pause';
      });

      document.getElementById('reset').addEventListener('click', function () {
        call('_ecs_reset', []);
      });

      // Cursor over the canvas aims the nozzle (clip space, y up); leaving snaps
      // it back to the default bottom-centre origin.
      var cv = document.getElementById('canvas');
      cv.addEventListener('pointermove', function (e) {
        var r = cv.getBoundingClientRect();
        var cx = ((e.clientX - r.left) / r.width) * 2 - 1;
        var cy = 1 - ((e.clientY - r.top) / r.height) * 2;
        call('_ecs_set_nozzle', [cx, cy]);
      });
      cv.addEventListener('pointerleave', function () {
        call('_ecs_set_nozzle', [0.0, -0.85]);
      });
    }

    var Module = {
      canvas: document.getElementById('canvas'),
      print:    function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
      onRuntimeInitialized: wireControls,
    };
  </script>
  <script src="particles.js"></script>
</body>
</html>
