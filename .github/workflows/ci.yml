name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Formatting is checked, not applied. The version comes from
  # .clang-format-version, which tools/format.sh also enforces -- one source of
  # truth, so a local run and CI cannot drift apart. Output is not stable across
  # clang-format majors, so an unpinned check would flap. Installed from PyPI
  # because the pinned version is not in the runner's apt.
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pip install "clang-format==$(cat .clang-format-version)"
      - name: Check formatting
        run: ./tools/format.sh --check

  # Portable-reflection builds on stock compilers, Debug (assert paths) and
  # Release. The P2996 path needs GCC 16, which no runner image ships yet --
  # revisit when it lands in ubuntu images.
  #
  # cmake_flags is deliberately EMPTY on one leg -- it is not about that
  # compiler's reflection support, it is the only leg that exercises the
  # option DEFAULTS. Every other leg here, and every preset, pins
  # ECS_USE_P2996 explicitly; that is why ECS_USE_P2996=ON could default to a
  # value no stock toolchain could configure and still keep CI green, while
  # breaking anyone following the README quickstart. This leg is the guard
  # against that recurring, so keep one entry passing no flags.
  native:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang-18 Debug
            cxx: clang++-18
            build_type: Debug
            packages: clang-18
            cmake_flags: -DECS_USE_P2996=OFF
          # No flags: asserts the option defaults configure and build.
          - name: clang-18 Release (option defaults)
            cxx: clang++-18
            build_type: Release
            packages: clang-18
            cmake_flags: ""
          - name: gcc-14 Debug
            cxx: g++-14
            build_type: Debug
            packages: g++-14
            cmake_flags: -DECS_USE_P2996=OFF
          - name: gcc-14 Release
            cxx: g++-14
            build_type: Release
            packages: g++-14
            cmake_flags: -DECS_USE_P2996=OFF
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          ${{ matrix.cmake_flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # Every header must compile on its own. A header that only works because
      # something else was included first breaks the moment an include list is
      # reordered or a consumer includes it directly.
      - name: Headers are self-contained
        if: matrix.build_type == 'Debug'
        run: ./tools/check_self_contained.sh ${{ matrix.cxx }}
      # Tiny-size run of every suite: catches bit-rot in the benchmarks and
      # the ECS_BENCH_OUT emit paths. Numbers from shared runners are NOT
      # gated -- only that every suite runs and emits its rows.
      - name: Benchmark smoke (Release only)
        if: matrix.build_type == 'Release'
        run: |
          export ECS_BENCH_OUT=$PWD/bench-smoke.csv
          export ECS_GIT_COMMIT=${GITHUB_SHA::7}
          export ECS_ENTITIES=20000 ECS_ITERS=3 ECS_REPEATS=2 ECS_TICKS=50
          for b in soa gather schedule churn primitives sort access; do
            ./build/benchmarks/${b}_bench
          done
          ECS_PARTICLES=5000 ECS_TICKS=40 ./build/examples/mist-headless
          python3 - <<'EOF'
          import collections, csv, sys
          rows = list(csv.DictReader(open("bench-smoke.csv")))
          suites = collections.Counter(r["suite"] for r in rows)
          print(dict(suites), f"{len(rows)} rows")
          expect = {"soa", "gather", "schedule", "churn", "primitives",
                    "sort", "access", "mist"}
          missing = expect - set(suites)
          if missing:
              sys.exit(f"suites emitted no rows: {sorted(missing)}")
          if any(r["commit"] == "unknown" for r in rows):
              sys.exit("envelope missing commit")
          EOF
      - name: Upload smoke results
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke-${{ matrix.name }}
          path: bench-smoke.csv

  # The library's core claims -- lock-free handoff, spin/park pool, sharded
  # command recording -- are exactly what the sanitizers exist to check.
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan+UBSan
            preset: asan-config
            build_dir: build-asan
          - name: TSan
            preset: tsan-config
            build_dir: build-tsan
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
          sudo ln -sf $(which clang++-18) /usr/local/bin/clang++
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build ${{ matrix.build_dir }}
      - name: Test
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1

  # Emscripten build of the wasm targets + the node smoke tests. Validates the
  # ILP32 hash paths, the portable reflection backend under wasm, and the
  # atomic_shared_ptr fallback (Emscripten's libc++).
  wasm:
    name: wasm (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Configure
        run: >
          emcmake cmake -S . -B build-wasm
          -DCMAKE_BUILD_TYPE=Release
          -DECS_BUILD_TESTS=OFF
          -DECS_BUILD_EXAMPLES=OFF
          -DECS_BUILD_BENCHMARKS=OFF
          -DECS_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build-wasm
      - name: Smoke test (single-threaded core)
        run: node build-wasm/web/ecs_smoke.js
      - name: Smoke test (dynamic components)
        run: node build-wasm/web/smoke_dynamic.mjs
      - name: Smoke test (parallel JS kernels)
        run: node build-wasm/web/ecs_parallel_smoke.js
